# AI助学小程序 - Nginx 反向代理配置
# 放置到 /etc/nginx/sites-available/ai-study 后软链到 sites-enabled

upstream ai_study_backend {
    server 127.0.0.1:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 日志
    access_log /var/log/nginx/ai-study-access.log;
    error_log /var/log/nginx/ai-study-error.log;

    # 健康检查
    location /health {
        proxy_pass http://ai_study_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API 代理
    location /api/ {
        proxy_pass http://ai_study_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # H5 前端（如果部署到同一域名）
    location / {
        root /opt/ai-study/frontend/dist;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # 静态文件缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        root /opt/ai-study/frontend/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

