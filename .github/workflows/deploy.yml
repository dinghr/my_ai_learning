name: Deploy AI助学小程序

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - test

jobs:
  deploy-backend:
    name: 部署后端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ./backend
        env:
          ENV: test
          database_url: sqlite:///./test.db
        run: |
          # 如有测试，取消注释：pytest
          echo "Tests placeholder"

      - name: Deploy to server (Production)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || inputs.environment == 'production'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/ai-study
            git pull origin main
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt
            # 数据库迁移（如有 Alembic）
            # alembic upgrade head
            sudo systemctl restart ai-study-backend
            echo "Production backend deployed"

      - name: Deploy to server (Test)
        if: inputs.environment == 'test'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_TEST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/ai-study-test
            git pull origin dev
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart ai-study-backend-test
            echo "Test backend deployed"

  deploy-frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build H5 (Production)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        working-directory: ./frontend
        env:
          TARO_APP_API_URL: ${{ secrets.PROD_API_URL }}
        run: npm run build:h5

      - name: Build H5 (Test)
        if: github.ref == 'refs/heads/dev' || inputs.environment == 'test'
        working-directory: ./frontend
        env:
          TARO_APP_API_URL: ${{ secrets.TEST_API_URL }}
        run: npm run build:h5

      # 如需自动部署 H5 到服务器，取消注释下面：
      # - name: Deploy H5 to server
      #   uses: appleboy/scp-action@v0.1.7
      #   with:
      #     host: ${{ secrets.SSH_HOST }}
      #     username: ${{ secrets.SSH_USER }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     source: "frontend/dist/*"
      #     target: "/opt/ai-study/frontend/"
      #     strip_components: 2
