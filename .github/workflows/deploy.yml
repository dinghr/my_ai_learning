name: Deploy AI助学小程序

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - test

jobs:
  deploy-backend:
    name: 部署后端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python
        run: python --version

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ./backend
        env:
          ENV: test
          database_url: sqlite:///./test.db
        run: |
          # 如有测试，取消注释：pytest
          echo "Tests placeholder"

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: deploy
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          script: |
            echo "SSH connection OK"
            whoami
            ls -la /var/www/ai-study 2>/dev/null || echo "Directory not found"

      - name: Deploy to server (Production)
        if: github.ref == 'refs/heads/dev' || inputs.environment == 'production'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: deploy
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          script_stop: false
          script: |
            set -e
            cd /var/www/ai-study || { echo "Directory not found"; exit 1; }
            git pull origin dev
            cd backend
            source venv/bin/activate || { echo "venv not found"; exit 1; }
            pip install -r requirements.txt
            # 数据库迁移（如有 Alembic）
            # alembic upgrade head
            # 如果 systemctl 不可用，尝试直接重启
            sudo systemctl restart ai-study-backend 2>/dev/null || echo "systemctl failed, manual restart needed"
            echo "Production backend deployed"

      - name: Deploy to server (Test)
        if: inputs.environment == 'test'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_HOST_TEST }}
          username: deploy
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          script: |
            set -e
            cd /var/www/ai-study-test
            git pull origin dev
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart ai-study-backend-test
            echo "Test backend deployed"

  deploy-frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    # 前端构建不依赖后端部署成功，可以并行执行
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Node
        run: node --version && npm --version

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm install
          npm ls --depth=0

      - name: Build H5
        working-directory: ./frontend
        env:
          TARO_APP_API_URL: ${{ secrets.PROD_API_URL || 'https://8.130.161.121/api' }}
          SASS_SILENCE_DEPRECATION_WARNINGS: '1'
        run: |
          set -o pipefail
          npm run build:h5 2>&1

      # 如需自动部署 H5 到服务器，取消注释下面：
      # - name: Deploy H5 to server
      #   uses: appleboy/scp-action@v0.1.7
      #   with:
      #     host: ${{ secrets.ALIYUN_HOST }}
      #     username: deploy
      #     key: ${{ secrets.ALIYUN_SSH_KEY }}
      #     source: "frontend/dist/*"
      #     target: "/var/www/ai-study/frontend/"
      #     strip_components: 2
